<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/48.png" alt="" width="20" height="20" />
      <h1>Annoyance Remover</h1>
    </header>
    <main>
      <label class="option">
        <span class="option-text">
          <span class="option-title">Hide picked elements</span>
          <span class="option-hint">Turn off to show everything again</span>
        </span>
        <input type="checkbox" class="switch" data-setting="enabled" />
      </label>

      <section id="site" hidden>
        <h2 id="site-name"></h2>
        <label class="option">
          <span class="option-text">
            <span class="option-title">Apply on every visit</span>
            <span class="option-hint">Otherwise picks only apply after you open this popup</span>
          </span>
          <input type="checkbox" class="switch" id="auto-apply" />
        </label>
        <div class="list-heading">
          <h3>Hidden on this site</h3>
          <span id="rule-count" class="count"></span>
        </div>
        <ul id="rules"></ul>
        <p id="no-rules" class="empty-card">Nothing hidden here yet.</p>
        <button id="pick" type="button">Pick element to hide</button>
      </section>

      <p id="unsupported" class="empty" hidden>Chrome doesn't allow extensions to run on this page.</p>
    </main>
    <script src="../settings.js"></script>
    <script src="../pattern.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
