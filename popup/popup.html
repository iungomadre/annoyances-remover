<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/48.png" alt="" width="20" height="20" />
      <h1>Meet Mute Warning Remover</h1>
    </header>
    <main>
      <label class="option">
        <span class="option-text">
          <span class="option-title">Hide mute warning</span>
          <span class="option-hint">Removes the "Microphone muted by system" popup</span>
        </span>
        <input type="checkbox" class="switch" data-setting="enabled" />
      </label>
    </main>
    <script src="../settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
